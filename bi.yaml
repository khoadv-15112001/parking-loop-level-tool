# yaml-language-server: $schema=https://bi.sonatgame.com/schemas/bi.v1.json
# Deploy ParkingLevel (tool level Parking Loop) lên BI Center: https://parkingloop.tools.sonatgame.com
# Kiểm: `sbp check bi.yaml`, `sbp explain bi.yaml`.
apiVersion: bi.sonatgame.com/v1
kind: LevelTool
slug: parkingloop

channels:
  release: {tag: 'parkingloop-v{semver}'}

env:
  PARKINGLEVEL_SESSION_SECRET: {secret: true, required: true, description: 'Signs sign-in sessions (changing it signs everyone out)'}
  PARKINGLEVEL_BI_ENV: {required: true, description: 'BI environment: prod or dev, the same as every BI_* value below'}
  PARKINGLEVEL_BI_API_URL: {required: true, description: 'BI API base URL: https://bi-apis.sonatgame.com (bi-dev: https://bi-be-dev.sonatgame.com)'}
  PARKINGLEVEL_BI_APP_ID: {required: true, description: 'Android app of the game on BI Level Hub: its package name, e.g. com.flow.out.watery.factory'}
  PARKINGLEVEL_BI_APP_ID_IOS: {description: 'iOS app of the game on BI Level Hub: id + App Store id, e.g. id6758755718; empty = Android only'}
  PARKINGLEVEL_BI_FIREBASE_API_KEY: {required: true, description: 'Firebase web config of BI (public): AIzaSy..., the same on every level tool of one BI environment'}
  PARKINGLEVEL_BI_FIREBASE_AUTH_DOMAIN: {required: true, description: 'Firebase web config of BI (public): sonat-bi-system.firebaseapp.com, bi-dev sonat-bi-system-dev.firebaseapp.com'}
  PARKINGLEVEL_BI_FIREBASE_PROJECT_ID: {required: true, description: 'Firebase web config of BI (public): sonat-bi-system, bi-dev sonat-bi-system-dev'}
  PARKINGLEVEL_BI_FIREBASE_APP_ID: {required: true, description: 'Firebase web config of BI (public): 1:<number>:web:<id>, the same on every level tool of one BI environment'}
  PARKINGLEVEL_ADMINS: {required: true, description: 'Admin emails, comma separated: pick or upload the WebGL game, production / archive flags, break locks'}
  PARKINGLEVEL_ALLOWED_DOMAIN: {description: 'Email domain allowed in (default sonat.vn)'}
  PARKINGLEVEL_CI_TOKEN: {secret: true, description: 'Shared with the game CI (Jenkins secret text parkingloop-level-tool-token): lets the WebGL build job upload the player and level data (only /api/ci/*). Empty = CI off'}
  PARKINGLEVEL_CI_BRANCH: {description: 'Branch whose CI builds become the current player; other branches wait for an admin. Empty = every build'}
  PARKINGLEVEL_CI_PACK: {description: 'Pack that receives CI levels; empty = the first default pack'}

components:
  - name: server
    type: service
    paths: [/]
    # Dockerfile của level-tool-core (node) copy levelcore/ + game/ nên build từ gốc repo
    build: {dockerfile: levelcore/deploy/Dockerfile.node, context: .}
    port: 8000
    health: /healthz
    timeouts: long          # SSE realtime + tải bản game WebGL theo từng phần 50 MB
    database: {type: sqlite, file: parkinglevel.db}
    uses: all
