<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Level tool</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="/core/ui-template.css">
  <link rel="stylesheet" href="game/game.css">
  <script type="module" src="js/main.mjs"></script>
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1 id="login-title">Level tool</h1>
      <p id="login-sub" class="muted"></p>
      <p id="login-msg" class="err"></p>
      <button id="login-google" class="primary" type="button" hidden>Đăng nhập bằng Google (BI)</button>
      <div id="login-dev" class="login-dev" hidden>
        <label>Email (DEV) <input id="login-email" type="email" placeholder="ten@sonat.vn" autocomplete="email"></label>
        <button type="submit">Vào (DEV)</button>
      </div>
      <a id="login-sso" class="btn" hidden>Đăng nhập SSO</a>
    </form>
  </div>

  <div id="app" hidden>
    <!-- Như Sand Jam / AntLevel. Hàng 1: tool · các màn · tìm nhanh (Ctrl+K) · sáng / tối · Quản trị (chỉ admin) · tài khoản.
         Hàng 2: bộ đang mở (chọn, tạo, cài đặt) rồi công cụ của màn đang mở. Đáy: kết nối, số level, bản game, phiên bản,
         người online. Màn Level: danh sách (tìm, lọc; dưới cùng tạo / nhập / tải) | level đang mở; dòng gợi ý phím ở đáy. -->
    <header class="topbar">
      <div id="brand-name" class="brand"></div>
      <nav class="views-nav" aria-label="Màn">
        <button data-view="level" title="Danh sách level và level đang mở: xem, sửa, chơi thử (Alt+1)">Level</button>
        <button data-view="library" title="Lưới ảnh level của bộ: lọc, xem nhanh, chọn nhiều level (Alt+2)">Thư viện</button>
        <button data-view="order" title="Thứ tự level trong bộ: đường chỉ số, kéo thả xếp lại, xuất Level Hub (Alt+3)">Thứ tự</button>
        <button data-view="overview" title="Tổng quan bộ: số level theo nhóm, đường chỉ số, cảnh báo, kiểm định cả bộ (Alt+4)">Tổng quan bộ</button>
        <button data-view="activity" title="Hoạt động: ai làm gì, lúc nào (Alt+5)">Hoạt động</button>
      </nav>
      <span class="grow"></span>
      <button id="btn-palette" class="palette-btn" title="Tìm level, đổi bộ, mở màn, chạy lệnh (Ctrl+K)">⌕ <span class="lb">Tìm level, bộ, lệnh…</span> <kbd>Ctrl K</kbd></button>
      <button id="btn-theme" class="icon" title="Giao diện sáng / tối (T)">◐</button>
      <button id="btn-admin" title="Quản trị: admin, quyền, thông báo, dung lượng, sao lưu" hidden>⚙ <span class="lb">Quản trị</span></button>
      <details class="more-menu user-menu">
        <summary id="me" title="Tài khoản"></summary>
        <div class="menu">
          <button id="btn-layout-menu">▦ Bố cục màn Level…</button>
          <button id="btn-keys">⌨ Phím tắt…</button>
          <button id="btn-whatsnew">✦ Có gì mới…</button>
          <button id="btn-logout">⎋ Đăng xuất</button>
        </div>
      </details>
    </header>
    <div id="notice" class="notice" hidden><span class="notice-text"></span><button class="icon" title="Ẩn thông báo này">×</button></div>

    <div class="ctxbar">
      <div class="pack-ctl">
        <select id="pack-select" title="Bộ level đang mở"></select>
        <button id="btn-new-pack" class="icon" title="Tạo bộ mới">＋</button>
        <button id="btn-pack-menu" class="icon" title="Cài đặt bộ: tên, nền tảng, nhóm, production, lưu trữ">⚙</button>
        <button id="btn-hub-sync" class="icon" title="Cập nhật từ Level Hub: tải lại toàn bộ level của bộ này từ BI" hidden>↻</button>
      </div>
      <!-- Màn Level: level đang mở · kiểm định · rev · tab · trạng thái · thao tác (đang xem: Sửa / Chơi thử; đang sửa: Lưu / Hoàn tác / Xong) -->
      <div class="ctx level-head" data-view="level">
        <span id="lv-none" class="muted small">Chọn một level ở danh sách bên trái</span>
        <button id="btn-prev" class="icon" title="Level trước (Alt+←)" hidden>‹</button>
        <h2 id="lv-title" hidden></h2>
        <button id="btn-next" class="icon" title="Level sau (Alt+→)" hidden>›</button>
        <button id="lv-valid" class="chip" title="Kết quả kiểm định — bấm để xem" hidden></button>
        <span id="lv-meta" class="muted small lv-meta"></span>
        <nav class="tabs" hidden>
          <button data-tab="overview" class="active" title="1">Tổng quan</button>
          <button data-tab="play" title="Khung game riêng một tab (đổi ở ▦ Bố cục)" hidden>Chơi thử</button>
          <button data-tab="json" title="2">JSON</button>
          <button data-tab="history" title="3">Lịch sử</button>
        </nav>
        <span id="lv-lock" class="badge" hidden></span>
        <span id="lv-dirty" class="badge warn" hidden>Chưa lưu</span>
        <div id="lv-actions" class="lv-actions" hidden>
          <button id="btn-edit" class="primary" title="Khoá level để sửa (E)">✎ Sửa</button>
          <button id="btn-revert" hidden title="Bỏ mọi thay đổi chưa lưu, trả level về bản đã lưu (vẫn giữ quyền sửa)">↺ Hoàn tác</button>
          <button id="btn-save" class="primary" hidden title="Ctrl+S">Lưu</button>
          <button id="btn-done" hidden title="Thôi sửa, nhả khoá (E)">Xong</button>
          <button id="btn-play" title="Chơi level này bằng game thật — kể cả bản nháp chưa lưu (P)">▶ Chơi thử</button>
          <button id="btn-share" class="icon" title="Link chơi trên điện thoại (Shift+P)" hidden>📱</button>
          <button id="btn-focus" class="icon" title="Chế độ tập trung: ẩn danh sách level, khung game rộng hơn (\)">⤢</button>
          <button id="btn-layout" class="icon" title="Bố cục: ẩn / hiện, đổi bên các cột, chỗ đặt khung game (kéo mép cột để đổi độ rộng)">▦</button>
          <details class="more-menu">
            <summary title="Thao tác khác">⋯</summary>
            <div class="menu">
              <button id="btn-relevel">Đổi số</button>
              <button id="btn-promote">Promote →</button>
              <button id="btn-download">Tải .json</button>
              <button id="btn-delete" class="danger">Xoá level</button>
            </div>
          </details>
        </div>
      </div>
      <div id="library-tools" class="ctx" data-view="library" hidden></div>
      <div id="order-tools" class="ctx" data-view="order" hidden></div>
      <div id="overview-tools" class="ctx" data-view="overview" hidden></div>
      <div id="activity-tools" class="ctx" data-view="activity" hidden></div>
    </div>

    <main class="views">
     <section id="view-level" class="view view-level">
      <div class="layout">
      <aside class="sidebar">
        <div class="list-tools">
          <input id="search" type="search" placeholder="Tìm: 12, 10-20, 2,5,9 hoặc chữ (/)" title="Tìm theo số level, dải số, danh sách số hoặc chữ (không cần dấu)">
          <select id="filter-mode" title="Lọc"></select>
        </div>
        <ul id="level-list" class="level-list"></ul>
        <div class="list-foot">
          <div class="row">
            <button id="btn-new-level" class="primary" title="Level mới (số trống đầu tiên) — N">＋ Mới</button>
            <button id="btn-import" title="Nhập level từ file zip / json (xem trước rồi mới ghi)">⇪ Nhập</button>
            <button id="btn-export" title="Tải cả bộ về máy (zip)">⇩ Tải</button>
            <details class="more-menu up">
              <summary title="Thao tác khác">⋯</summary>
              <div class="menu">
                <button id="btn-levelhub-bi" hidden>Mở bộ từ BI Level Hub…</button>
                <button id="btn-trash" hidden>🗑 Thùng rác…</button>
              </div>
            </details>
          </div>
          <span id="list-stats" class="muted small"></span>
        </div>
        <input id="file-import" type="file" accept=".zip,.json" hidden>
        <div class="grip" data-pref="listW" data-edge="right"></div>
      </aside>

      <section class="panel">
        <div id="panel-empty" class="empty muted">Chọn một level ở danh sách bên trái</div>
        <div id="panel-body" hidden>
          <div class="tab" id="tab-overview">
            <!-- Cột xếp bằng main.mjs layOverview theo bố cục của người dùng (layout.mjs): thông số + kiểm định (trái / phải / ẩn)
                 | phần chính = editor của game (ui.mjs renderEditor) hoặc khung game | khung game (cột phải hoặc tab Chơi thử khi
                 game có editor) | thông tin của game (renderOverview → ctx.info). Mép cột (.grip) kéo được. Khung game không bao
                 giờ display:none (iframe dừng chạy): ẩn bằng class off. -->
            <div class="overview">
              <div class="col-form">
                <div class="col-scroll">
                  <div id="game-form"></div>
                  <section id="valid-card" class="card"><h3>Kiểm định</h3><div id="validation" class="validation"></div></section>
                </div>
                <div class="grip" data-pref="formW"></div>
              </div>
              <div id="editor-host" class="col-editor" hidden></div>
              <div class="col-game">
                <div id="game-dock" class="game-dock"></div>
                <div class="grip" data-pref="gameW" data-edge="left"></div>
              </div>
              <div class="col-info" hidden>
                <div class="col-scroll"><div id="game-info"></div></div>
                <div class="grip" data-pref="infoW"></div>
              </div>
            </div>
          </div>

          <div class="tab" id="tab-json" hidden>
            <textarea id="json-text" spellcheck="false"></textarea>
            <div class="row"><button id="btn-json-apply">Áp vào bản nháp</button><span id="json-msg" class="small"></span></div>
          </div>

          <div class="tab" id="tab-history" hidden>
            <ul id="history-list" class="history"></ul>
            <div id="plays-box" hidden><h4>Lượt chơi thử</h4><div id="plays-list"></div></div>
          </div>
        </div>
      </section>
      </div>
      <div id="hintbar" class="hintbar"></div>
     </section>
     <section id="view-library" class="view" hidden></section>
     <section id="view-order" class="view" hidden></section>
     <section id="view-overview" class="view" hidden></section>
     <section id="view-activity" class="view" hidden></section>
    </main>

    <footer class="statusbar">
      <span id="conn" class="conn"></span><span id="conn-text">Đang kết nối…</span>
      <span id="st-count" class="st"></span>
      <button id="st-game" class="st link" hidden></button>
      <span class="grow"></span>
      <span id="app-version" class="st version" title="Phiên bản đang chạy"></span>
      <span id="online" class="st online"></span>
    </footer>
  </div>

  <div id="dialog-root"></div>
  <div id="toast-root" class="toasts"></div>
</body>
</html>
