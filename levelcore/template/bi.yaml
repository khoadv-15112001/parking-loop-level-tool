# yaml-language-server: $schema=https://bi.sonatgame.com/schemas/bi.v1.json
# Deploy __TOOL__ (tool level __GAME__) lên BI Center: https://__SLUG__.tools.sonatgame.com
# Kiểm: `sbp check bi.yaml`, `sbp explain bi.yaml`.
apiVersion: bi.sonatgame.com/v1
kind: LevelTool
slug: __SLUG__

channels:
  release: {tag: '__SLUG__-v{semver}'}

env:
  __PREFIX___SESSION_SECRET: {secret: true, required: true, description: 'Signs sign-in sessions (changing it signs everyone out)'}
  __PREFIX___BI_ENV: {required: true, description: 'BI environment: dev or prod (label on the sign-in button)'}
  __PREFIX___BI_API_URL: {required: true, description: 'BI API base URL: https://bi-apis.sonatgame.com (bi-dev: https://bi-be-dev.sonatgame.com)'}
  __PREFIX___BI_APP_ID: {required: true, description: 'Android app of the game on BI Level Hub'}
  __PREFIX___BI_APP_ID_IOS: {description: 'iOS app of the game on BI Level Hub; empty = Android only'}
  __PREFIX___BI_FIREBASE_API_KEY: {required: true, description: Firebase web config of BI (public)}
  __PREFIX___BI_FIREBASE_AUTH_DOMAIN: {required: true, description: Firebase web config of BI (public)}
  __PREFIX___BI_FIREBASE_PROJECT_ID: {required: true, description: Firebase web config of BI (public)}
  __PREFIX___BI_FIREBASE_APP_ID: {required: true, description: Firebase web config of BI (public)}
  __PREFIX___ADMINS: {description: 'Admin emails, comma separated: upload the WebGL game, production / archive flags, break locks. Empty = everyone'}
  __PREFIX___ALLOWED_DOMAIN: {description: 'Email domain allowed in (default sonat.vn)'}
  __PREFIX___CI_TOKEN: {secret: true, description: 'Token Jenkins sends with the WebGL player and level data (only /api/ci/*); empty = CI off'}
  __PREFIX___CI_BRANCH: {description: 'Branch whose CI builds become the current player; other branches wait for an admin. Empty = every build'}
  __PREFIX___CI_PACK: {description: 'Pack that receives CI levels; empty = the first default pack'}

components:
  - name: server
    type: service
    paths: [/]
    # Dockerfile của level-tool-core copy levelcore/ + game/ nên build từ gốc repo
    build: {dockerfile: levelcore/deploy/Dockerfile, context: .}
    port: 8000
    health: /healthz
    timeouts: long          # SSE realtime + tải bản game WebGL theo từng phần 50 MB
    database: {type: sqlite, file: __DBFILE__}
    uses: all
